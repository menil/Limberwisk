name: Release PR

# Keeps one "release" pull request open on main. It bumps the version and the changelog from
# the Conventional Commit titles. Merging it creates the vX.Y.Z tag and a DRAFT release, and
# this workflow then calls release.yml to build the DMG and add it to that draft. A person
# still decides when to release (by merging) and when to publish (the draft).
# See docs/releasing.md.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write # release-please labels the release PR

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        name: Open or update the release PR, and tag when it is merged
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  # The tag release-please makes with the built-in token starts no workflow, so the build is
  # called here instead of being triggered by the tag.
  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
    permissions:
      contents: write
