name: Release

# Builds the app for a tag such as v1.0.0 and attaches a DMG to a DRAFT release, so a person
# reviews it before anything is published. It runs when such a tag is pushed by hand, and
# when release-please.yml calls it after merging a release PR: tags made with the built-in
# token start no workflow of their own. See docs/releasing.md.
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: The tag to build, for example v1.0.0.
        required: true
        type: string

# Read-only by default. Only the final job, which runs none of the project's code, may write.
permissions:
  contents: read

env:
  # Pushed by hand, the tag is the ref. Called from another workflow, the ref is main, so
  # the tag comes in as an input.
  TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    # Apple Silicon runner; the bundle is still universal2 (arm64 + x86_64).
    runs-on: macos-14
    timeout-minutes: 60
    # Hold the signing secrets in this environment and add required reviewers to it (see
    # docs/releasing.md), so a pushed tag alone cannot reach them.
    environment: release
    env:
      # The python.org installer is universal2 (the hosted Python is not), and its hash is
      # pinned. Change the version and the hash together.
      PYTHON_VERSION: "3.14.2"
      PYTHON_PKG_SHA256: fc98ed71cd7b76d1ac19a31ef1641d177854ebec54413ffe3666767ead77ebb7
      # Whether a signing certificate is configured. The secrets themselves are exposed
      # only to the steps that need them, never to the install and test steps below.
      HAS_CERT: ${{ secrets.MACOS_CERTIFICATE != '' }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Install a universal2 Python
        run: |
          curl -fsSL --proto '=https' --tlsv1.2 -o python.pkg \
            "https://www.python.org/ftp/python/$PYTHON_VERSION/python-$PYTHON_VERSION-macos11.pkg"
          echo "$PYTHON_PKG_SHA256  python.pkg" | shasum -a 256 -c -
          sudo installer -pkg python.pkg -target /
          minor="${PYTHON_VERSION%.*}"
          "/Library/Frameworks/Python.framework/Versions/$minor/bin/python$minor" -m venv .venv
          .venv/bin/pip install -e '.[dev,build]'

      - name: Check the tag matches the code's version
        run: |
          version="$(.venv/bin/python -c 'import muteme_flow; print(muteme_flow.__version__)')"
          base="${TAG#v}"; base="${base%%-*}"  # v1.0.0-rc1 releases 1.0.0
          if [ "$base" != "$version" ]; then
            echo "Tag $TAG does not match the code's version $version." >&2
            exit 1
          fi

      - name: Lint and test
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
          .venv/bin/pytest

      - name: Import the signing certificate
        if: env.HAS_CERT == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "$MACOS_SIGN_IDENTITY" ]; then
            echo "MACOS_SIGN_IDENTITY is empty; refusing to fall back to an unsigned build." >&2
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain
          xcrun notarytool store-credentials ci --keychain "$keychain" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          {
            echo "SIGN_IDENTITY=$MACOS_SIGN_IDENTITY"
            echo "NOTARY_PROFILE=ci"
            echo "NOTARY_KEYCHAIN=$keychain"
          } >> "$GITHUB_ENV"

      - name: Build the app
        run: scripts/build_app.sh

      - name: Notarize the app
        if: env.HAS_CERT == 'true'
        run: scripts/notarize.sh "dist/MuteMe Flow.app"

      - name: Build the DMG
        run: scripts/make_dmg.sh

      - name: Notarize the DMG
        if: env.HAS_CERT == 'true'
        run: scripts/notarize.sh dist/MuteMe-Flow-*.dmg

      - name: Stage the release files
        run: |
          # One folder holding exactly what the release job needs. Uploading dist/ and a
          # file from the repository root separately made upload-artifact keep the dist/
          # prefix, so the release job's glob found nothing (found by the first run).
          mkdir release
          cp dist/MuteMe-Flow-*.dmg release/
          # The same file under a name without the version, so the README can link to
          # releases/latest/download/MuteMe-Flow.dmg and always get the newest release.
          cp dist/MuteMe-Flow-*.dmg release/MuteMe-Flow.dmg
          if [ "$HAS_CERT" = true ]; then
            echo "Signed and notarized: open the DMG and drag the app to Applications." > release/notes.md
          else
            cat > release/notes.md <<'NOTES'
          **This build is not notarized**, so macOS refuses it the first time. After dragging
          MuteMe Flow to Applications:

          - **macOS 15 and later:** try to open it, then go to System Settings > Privacy &
            Security and choose **Open Anyway**.
          - **macOS 13 and 14:** right-click the app and choose Open.
          NOTES
          fi
          {
            echo
            echo "SHA-256:"
            echo '```'
            (cd release && shasum -a 256 MuteMe-Flow-*.dmg)
            echo '```'
          } >> release/notes.md

      - name: Remove the signing keychain
        if: always() && env.HAS_CERT == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/certificate.p12"

      - name: Keep the build for the release job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          # A single folder, so its contents sit at the artifact's root.
          path: release/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job with write access. It runs no project code, only the gh CLI.
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Fetch the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      - name: Draft the release
        run: |
          # A tag made by the release PR (release-please) already has a draft, holding the
          # changelog: put the install notes above it and add the files. Re-running must not
          # add the notes twice, hence the SHA-256 check.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release view "$TAG" --json body --jq .body > existing.md
            if ! grep -q "SHA-256:" existing.md; then
              { cat notes.md; echo; cat existing.md; } > body.md
              gh release edit "$TAG" --notes-file body.md
            fi
            gh release upload "$TAG" MuteMe-Flow-*.dmg MuteMe-Flow.dmg --clobber
            exit 0
          fi
          # Otherwise (a tag pushed by hand) create the draft. If one from an earlier run
          # exists for another reason, delete it first (docs/releasing.md); GitHub does not
          # stop a second draft being created.
          flags=(--draft)
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" MuteMe-Flow-*.dmg MuteMe-Flow.dmg "${flags[@]}" \
            --title "MuteMe Flow $TAG" --notes-file notes.md --generate-notes
